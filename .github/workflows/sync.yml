name: Sync Upstream Main

on:
  schedule:
    - cron: "*/5 * * * *" # This triggers the action precisely every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync Upstream
        uses: arolla/sync-fork-action@v1
        with:
          upstream_repository: rayyankah/EchoDerm-AI
          upstream_branch: main
          target_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
